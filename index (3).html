<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5ed" />
    <meta name="description" content="Explore renewable electricity, energy access, efficiency, storage, and community clean-energy projects." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <style>
:root {
  color-scheme: light;
  --paper: #f6f4ec;
  --paper-deep: #eeece1;
  --ink: #24312a;
  --muted: #6e786f;
  --green: #294434;
  --green-2: #4d7055;
  --green-soft: #e7ede4;
  --gold: #dfbb5a;
  --gold-soft: #f5edce;
  --clay: #b96f51;
  --line: #dedfd4;
  --white: #fffefa;
  --shadow: 0 14px 40px rgba(46, 57, 44, .07);
  font-family: 'Avenir Next', 'Segoe UI', Arial, sans-serif;
  color: var(--ink);
  background: var(--paper);
  font-synthesis: none;
  text-rendering: optimizeLegibility;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; min-width: 320px; background: var(--paper); }
button, input { font: inherit; }
button { color: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid #90711e; outline-offset: 3px; }
a { color: var(--green); text-underline-offset: 3px; }
.skip-link { position: fixed; top: -60px; left: 12px; z-index: 100; background: var(--green); color: white; padding: 12px 16px; border-radius: 8px; }
.skip-link:focus { top: 12px; }
.app-shell { min-height: 100vh; padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
.topbar { height: 76px; padding: 0 clamp(20px, 6vw, 88px); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(91, 103, 84, .14); background: rgba(246, 244, 236, .92); position: sticky; top: 0; z-index: 20; backdrop-filter: blur(12px); }
.brand { padding: 0; display: inline-flex; align-items: center; gap: 10px; border: 0; background: none; text-align: left; cursor: pointer; }
.brand-mark { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 13px; background: var(--green); }
.brand-mark svg { width: 29px; height: 29px; fill: var(--gold); stroke: var(--green); stroke-width: 1.3; stroke-linejoin: round; }
.brand-copy strong { display: block; color: var(--green); font-size: 16px; letter-spacing: -.035em; }
.brand-copy small { display: block; color: var(--muted); font-size: 10px; margin-top: 2px; letter-spacing: .02em; }
.topbar-right { display: flex; align-items: center; gap: 22px; }
.prototype-pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 11px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); font-size: 11px; }
.prototype-pill i { width: 7px; height: 7px; display: block; background: #75906e; border-radius: 50%; }
.top-cta, .btn { display: inline-flex; gap: 12px; align-items: center; justify-content: center; border: 0; border-radius: 999px; padding: 13px 18px; color: #fffefa; background: var(--green); font-size: 13px; font-weight: 600; text-decoration: none; cursor: pointer; transition: transform .18s ease, background .18s ease; }
.top-cta:hover, .btn:hover { background: #1f3829; transform: translateY(-1px); }
.btn-gold { color: var(--ink); background: var(--gold); }
.btn-gold:hover { background: #e8c965; }
.btn-outline { border: 1px solid var(--line); color: var(--green); background: transparent; }
.btn-outline:hover { background: var(--white); }
.btn-small { padding: 9px 13px; font-size: 12px; }
.text-button { color: var(--green); border: 0; background: transparent; padding: 7px 0; font-size: 13px; font-weight: 600; text-decoration: underline; text-underline-offset: 4px; cursor: pointer; }
main { width: min(1120px, calc(100% - 48px)); margin: 0 auto; padding: 38px 0 76px; outline: none; }
.page { animation: arrive .26s ease both; }
@keyframes arrive { from { opacity: .5; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
.screen-tag, .eyebrow { color: var(--green-2); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; }
.screen-tag { margin: 0 0 12px; display: flex; align-items: center; gap: 9px; }
.screen-tag::before { content: ''; width: 21px; height: 1px; background: var(--gold); }
h1, h2, h3, .serif { font-family: 'Avenir Next', 'Segoe UI', Arial, sans-serif; font-weight: 600; letter-spacing: -.035em; }
h1 { font-size: clamp(38px, 6vw, 66px); line-height: 1.04; margin: 0; }
h2 { font-size: clamp(28px, 4vw, 42px); line-height: 1.13; margin: 0; }
h3 { font-size: 22px; line-height: 1.2; margin: 0; }
p { line-height: 1.65; }
.lede { max-width: 540px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 18px 0 0; }
.page-head { margin-bottom: 29px; }
.page-head .lede { margin-top: 12px; }
.section-kicker { display: flex; align-items: center; gap: 10px; color: var(--green-2); font-size: 10px; text-transform: uppercase; font-weight: 700; letter-spacing: .14em; margin-bottom: 10px; }
.section-kicker::before { content: ''; width: 22px; height: 1px; background: var(--gold); }
.hero { display: grid; grid-template-columns: 1.02fr .98fr; min-height: 422px; align-items: center; gap: 32px; padding: 15px 0 33px; }
.hero-copy { max-width: 540px; }
.hero-copy h1 em { color: var(--green-2); font-weight: 500; }
.hero-copy .lede { max-width: 480px; }
.hero-actions { display: flex; gap: 20px; align-items: center; margin-top: 27px; flex-wrap: wrap; }
.hero-art { position: relative; min-height: 338px; border-radius: 5px 56px 5px 5px; overflow: hidden; background: #e7eadb; }
.hero-art svg { display: block; width: 100%; height: 100%; min-height: 338px; }
.hero-caption { position: absolute; right: 16px; bottom: 14px; border: 1px solid rgba(255,255,255,.7); background: rgba(255,254,250,.82); padding: 8px 11px; color: var(--green); font-size: 10px; }
.hero-note { display: inline-flex; align-items: center; gap: 9px; margin-top: 27px; color: var(--muted); font-size: 11px; }
.hero-note b { color: var(--gold); font-size: 17px; font-weight: 500; }
.rule { border: 0; border-top: 1px solid var(--line); margin: 21px 0; }
.home-band { display: grid; grid-template-columns: 1.3fr repeat(3, 1fr); border-block: 1px solid var(--line); padding: 21px 0; margin: 14px 0 37px; gap: 0; }
.home-band-intro { padding-right: 22px; }
.home-band-intro strong { font-family: inherit; font-size: 18px; font-weight: 700; }
.home-band-intro p { margin: 7px 0 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
.band-item { padding: 3px 16px; border-left: 1px solid var(--line); }
.band-item b { display: block; font-family: inherit; color: var(--green); font-size: 23px; font-weight: 700; }
.band-item span { color: var(--muted); font-size: 11px; }
.section-row { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin: 37px 0 17px; }
.section-row p { margin: 7px 0 0; color: var(--muted); font-size: 13px; }
.three-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
.two-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.info-card, .target-card, .org-card, .activity-card { border: 1px solid var(--line); background: rgba(255, 254, 250, .64); padding: 20px; }
.target-card { min-height: 196px; position: relative; padding-top: 23px; }
.target-number { color: var(--clay); font-size: 10px; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; }
.target-card h3 { margin: 13px 0 9px; font-size: 23px; }
.target-card p, .info-card p { color: var(--muted); font-size: 13px; margin: 0; line-height: 1.62; }
.target-card .target-link { display: inline-flex; margin-top: 16px; font-size: 11px; font-weight: 700; color: var(--green); }
.callout { display: grid; grid-template-columns: 48px 1fr; gap: 14px; padding: 21px; background: var(--green); color: var(--white); margin: 25px 0; }
.callout-icon { width: 39px; height: 39px; display: grid; place-items: center; border-radius: 50%; background: var(--gold); color: var(--ink); font-family: inherit; font-size: 21px; }
.callout h3 { font-size: 20px; }
.callout p { color: rgba(255,254,250,.77); font-size: 12px; margin: 7px 0 0; max-width: 730px; }
.definition-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border: 1px solid var(--line); background: rgba(255,254,250,.5); }
.definition { padding: 18px 20px; }
.definition + .definition { border-left: 1px solid var(--line); }
.definition span { color: var(--clay); text-transform: uppercase; letter-spacing: .1em; font-weight: 700; font-size: 9px; }
.definition h3 { font-family: inherit; font-size: 15px; font-weight: 700; margin: 7px 0; letter-spacing: 0; }
.definition p { margin: 0; color: var(--muted); font-size: 12px; }
.journey { display: grid; grid-template-columns: repeat(6, 1fr); margin: 25px 0; position: relative; }
.journey::before { content: ''; position: absolute; top: 23px; left: 7%; right: 7%; border-top: 1px dashed #a7b29e; z-index: 0; }
.journey-stage { z-index: 1; padding: 0 8px; border: 0; background: none; text-align: center; cursor: pointer; }
.stage-dot { width: 46px; height: 46px; display: grid; place-items: center; margin: 0 auto 11px; border: 1px solid #b7c2b0; border-radius: 50%; background: var(--paper); color: var(--green); font-size: 16px; transition: all .18s ease; }
.journey-stage[aria-pressed="true"] .stage-dot, .journey-stage:hover .stage-dot { background: var(--green); color: var(--gold); border-color: var(--green); }
.stage-num { display: block; font-size: 9px; color: var(--muted); margin-bottom: 3px; }
.stage-name { display: block; font-size: 11px; line-height: 1.35; font-weight: 600; }
.stage-detail { min-height: 95px; border-left: 3px solid var(--gold); background: var(--white); padding: 16px 19px; display: grid; grid-template-columns: 1fr auto; gap: 15px; align-items: center; }
.stage-detail h3 { font-size: 19px; }
.stage-detail p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
.muted { color: var(--muted); }
.demo-note { color: #775f23; font-size: 10px; display: inline-flex; align-items: center; gap: 7px; padding: 7px 10px; background: var(--gold-soft); }
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 22px 0; }
.stats-grid.game-results { grid-template-columns: repeat(5, 1fr); }
.stat-card { padding: 20px; min-height: 150px; border-top: 2px solid var(--green-2); background: var(--white); }
.stat-card .stat-num { font-family: inherit; font-size: 36px; line-height: 1; font-weight: 700; color: var(--green); }
.stat-card h3 { font-family: inherit; font-size: 12px; font-weight: 700; letter-spacing: 0; margin: 11px 0 5px; }
.stat-card p { color: var(--muted); font-size: 10px; margin: 0; line-height: 1.5; }
.chart-card { border: 1px solid var(--line); background: rgba(255,254,250,.7); padding: 20px; }
.chart-card h3 { font-size: 20px; }
.chart-card > p { color: var(--muted); font-size: 11px; margin: 6px 0 18px; }
.bar-list { display: grid; gap: 13px; }
.bar-row { display: grid; grid-template-columns: 112px 1fr 35px; gap: 12px; align-items: center; font-size: 11px; }
.bar-track { height: 9px; border-radius: 99px; background: var(--paper-deep); overflow: hidden; }
.bar-fill { height: 100%; background: var(--green-2); border-radius: inherit; }
.bar-row:nth-child(2) .bar-fill { background: #9aab7c; }
.bar-row:nth-child(3) .bar-fill { background: var(--gold); }
.bar-row:nth-child(4) .bar-fill { background: #bd886b; }
.source-list { display: flex; gap: 10px 20px; flex-wrap: wrap; font-size: 11px; margin-top: 16px; }
.network-toolbar { display: grid; grid-template-columns: minmax(170px, 1fr) auto auto; gap: 10px; margin: 20px 0 13px; }
.search-wrap { position: relative; }
.search-wrap span { position: absolute; left: 13px; top: 10px; color: var(--muted); }
.search-input { width: 100%; min-height: 42px; padding: 10px 12px 10px 36px; border: 1px solid var(--line); background: var(--white); color: var(--ink); border-radius: 2px; font-size: 12px; }
.select-control { min-height: 42px; border: 1px solid var(--line); background: var(--white); color: var(--ink); padding: 8px 12px; border-radius: 2px; font-size: 12px; }
.toggle-group { display: flex; border: 1px solid var(--line); padding: 3px; background: var(--white); }
.toggle-group button { border: 0; background: transparent; padding: 0 12px; font-size: 11px; cursor: pointer; }
.toggle-group button[aria-pressed="true"] { background: var(--green); color: white; }
.explore-layout { display: grid; grid-template-columns: 1.15fr .85fr; gap: 14px; align-items: stretch; }
.map-card { min-height: 395px; background: #e9ebdf; border: 1px solid #d7ddcb; position: relative; overflow: hidden; }
.map-card svg.map-drawing { position: absolute; inset: 0; width: 100%; height: 100%; }
.map-label { position: absolute; top: 14px; left: 14px; border: 1px solid #d0d5c5; padding: 7px 9px; background: rgba(255,254,250,.9); color: var(--muted); font-size: 9px; letter-spacing: .06em; text-transform: uppercase; }
.map-pin { position: absolute; transform: translate(-50%, -50%); border: 2px solid var(--white); border-radius: 50%; width: 36px; height: 36px; display: grid; place-items: center; color: white; background: var(--green); box-shadow: 0 3px 11px rgba(31,48,37,.2); cursor: pointer; }
.map-pin[data-type="market"] { background: #b77953; }
.map-pin[data-type="pantry"] { background: #b08b36; }
.map-pin[aria-label]:focus-visible { outline-offset: 2px; }
.map-pin span { font-size: 12px; }
.map-legend { position: absolute; bottom: 13px; left: 13px; right: 13px; display: flex; gap: 14px; flex-wrap: wrap; background: rgba(255,254,250,.9); padding: 10px; font-size: 9px; color: var(--muted); }
.legend-dot { width: 7px; height: 7px; display: inline-block; border-radius: 50%; margin-right: 5px; background: var(--green); }
.legend-dot.market { background: #b77953; }.legend-dot.pantry { background: #b08b36; }
.org-list { display: grid; gap: 9px; align-content: start; }
.org-card { padding: 15px; text-align: left; cursor: pointer; transition: border .15s, transform .15s; }
.org-card:hover { border-color: var(--green-2); transform: translateY(-1px); }
.org-topline { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.org-type { font-size: 9px; color: var(--green-2); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.org-status { font-size: 9px; border-radius: 50px; padding: 5px 8px; background: var(--green-soft); color: var(--green); white-space: nowrap; }
.org-card h3 { font-size: 19px; margin: 8px 0 5px; }
.org-meta { color: var(--muted); font-size: 10px; display: flex; align-items: center; gap: 6px; }
.org-card p { margin: 8px 0 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
.no-results { padding: 22px; text-align: center; color: var(--muted); border: 1px dashed var(--line); background: var(--white); font-size: 12px; }
.profile-hero { display: grid; grid-template-columns: .88fr 1.12fr; min-height: 290px; background: var(--green); color: var(--white); }
.profile-art { position: relative; min-height: 280px; overflow: hidden; background: #a7b38c; }
.profile-art svg { width: 100%; height: 100%; min-height: 280px; display: block; }
.profile-copy { padding: 35px clamp(24px, 5vw, 50px); display: flex; flex-direction: column; justify-content: center; }
.profile-copy .screen-tag { color: #d5dfd1; }
.profile-copy h1 { font-size: clamp(30px, 4vw, 45px); }
.profile-copy p { max-width: 500px; color: rgba(255,254,250,.76); font-size: 13px; margin: 14px 0 0; }
.profile-details { display: grid; grid-template-columns: repeat(3, 1fr); margin: 15px 0 28px; border: 1px solid var(--line); background: var(--white); }
.profile-details > div { padding: 16px; }
.profile-details > div + div { border-left: 1px solid var(--line); }
.profile-details span { display: block; text-transform: uppercase; font-size: 9px; letter-spacing: .12em; color: var(--muted); }
.profile-details b { display: block; margin-top: 6px; color: var(--green); font-size: 12px; }
.profile-body { display: grid; grid-template-columns: 1fr 1fr; gap: 23px; }
.profile-body .info-card { padding: 21px; }
.profile-body h3 { font-size: 20px; margin-bottom: 9px; }
.profile-body p, .profile-body li { font-size: 12px; color: var(--muted); line-height: 1.65; }
.profile-body ul { margin: 0; padding-left: 18px; }
.play-intro { display: grid; grid-template-columns: 1.03fr .97fr; gap: 28px; align-items: center; padding: 19px 0 35px; }
.play-illustration { min-height: 270px; background: #e9ebdf; border-radius: 3px 52px 3px 3px; position: relative; overflow: hidden; }
.play-illustration svg { width: 100%; height: 100%; min-height: 270px; display: block; }
.activity-card { display: grid; grid-template-columns: 44px 1fr auto; gap: 14px; align-items: center; padding: 18px; }
.activity-card + .activity-card { margin-top: 11px; }
.activity-icon { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--green-soft); color: var(--green); font-size: 18px; }
.activity-card h3 { font-size: 19px; }
.activity-card p { color: var(--muted); font-size: 11px; margin: 4px 0; }
.duration { color: var(--clay); font-size: 10px; font-weight: 700; }
.quiz-card { width: min(690px, 100%); margin: 0 auto; padding: clamp(20px, 5vw, 38px); border: 1px solid var(--line); background: var(--white); }
.quiz-meta { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); }
.progress-track { height: 5px; background: var(--paper-deep); margin: 13px 0 29px; }
.progress-fill { height: 100%; background: var(--green-2); transition: width .25s ease; }
.quiz-card h1 { font-size: clamp(25px, 4vw, 35px); line-height: 1.2; }
.answers { display: grid; gap: 9px; margin: 22px 0; }
.answer-option { text-align: left; display: flex; align-items: center; gap: 12px; padding: 13px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: 12px; line-height: 1.4; }
.answer-option:hover { background: #f9f8f1; border-color: #aeb9a8; }
.answer-option[aria-pressed="true"] { border-color: var(--green-2); background: var(--green-soft); }
.answer-option[disabled] { cursor: default; }
.answer-letter { width: 25px; height: 25px; border: 1px solid var(--line); display: grid; place-items: center; flex: 0 0 25px; border-radius: 50%; color: var(--green); font-size: 10px; font-weight: 700; }
.answer-option.correct { background: #e8f1e5; border-color: #76946e; }
.answer-option.incorrect { background: #f7e9df; border-color: #cb8b6b; }
.feedback { margin: 0 0 20px; padding: 14px; border-left: 3px solid var(--green-2); background: #f0f3e9; }
.feedback.wrong { border-color: var(--clay); background: #f8eee8; }
.feedback b { display: block; font-size: 12px; }
.feedback p { margin: 5px 0 0; color: var(--muted); font-size: 11px; }
.quiz-footer { display: flex; align-items: center; justify-content: space-between; gap: 15px; }
.quiz-footer span { color: var(--muted); font-size: 10px; }
.game-top { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0; }
.game-metric { flex: 1; min-width: 130px; padding: 14px 16px; border: 1px solid var(--line); background: var(--white); }
.game-metric span { display: block; color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: .1em; }
.game-metric b { display: block; font-family: inherit; color: var(--green); font-size: 26px; font-weight: 700; margin-top: 4px; }
.demand-list { display: grid; gap: 10px; }
.demand-card { display: grid; grid-template-columns: minmax(155px, .8fr) 1.2fr auto; gap: 16px; align-items: center; padding: 15px; border: 1px solid var(--line); background: var(--white); }
.demand-card h3 { font-size: 18px; }
.demand-card p { margin: 4px 0 0; color: var(--muted); font-size: 10px; }
.allocation { display: flex; align-items: center; gap: 11px; }
.allocation input { width: 100%; accent-color: var(--green); }
.allocation output { min-width: 63px; text-align: right; color: var(--green); font-size: 12px; font-weight: 700; }
.load-state { margin: 15px 0; display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--muted); }
.load-track { flex: 1; height: 8px; background: var(--paper-deep); overflow: hidden; }
.load-fill { height: 100%; background: var(--green-2); transition: width .2s; }
.load-fill.over { background: var(--clay); }
.result-hero { text-align: center; max-width: 720px; margin: 0 auto 29px; padding: 16px 0; }
.score-circle { width: 105px; height: 105px; margin: 21px auto 15px; border-radius: 50%; border: 1px solid #aeb9a8; background: var(--green); color: var(--gold); display: grid; place-items: center; font-family: inherit; font-size: 31px; font-weight: 700; }
.result-hero p { max-width: 550px; margin: 11px auto 0; color: var(--muted); font-size: 13px; }
.checklist { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 18px 0 25px; }
.action-option { display: flex; gap: 11px; align-items: start; padding: 15px; border: 1px solid var(--line); background: var(--white); font-size: 12px; line-height: 1.5; cursor: pointer; }
.action-option input { accent-color: var(--green); margin-top: 3px; }
.cta-banner { display: flex; justify-content: space-between; align-items: center; gap: 18px; padding: 23px; background: var(--green); color: var(--white); }
.cta-banner p { color: rgba(255,254,250,.74); font-size: 12px; margin: 6px 0 0; }
.cta-banner h3 { font-size: 22px; }
.empty-state { padding: 22px; border: 1px dashed var(--line); text-align: center; color: var(--muted); font-size: 12px; background: var(--white); }
.toast { position: fixed; z-index: 50; bottom: calc(90px + env(safe-area-inset-bottom)); left: 50%; transform: translate(-50%, 15px); opacity: 0; pointer-events: none; color: #fff; background: var(--ink); padding: 11px 15px; font-size: 11px; transition: .18s; max-width: calc(100vw - 30px); text-align: center; }
.toast.visible { opacity: 1; transform: translate(-50%, 0); }

  return `<section class="page">${sectionHead('04', 'MY IMPACT · THE NETWORK', 'Local impact at a glance', 'These teaching figures help explain what a community network might measure. They are simulated examples, not verified local results.')}

    <div class="section-row"><div><span class="eyebrow">Your learning</span><h2 style="font-size:28px">Personal progress</h2><p>Sign in to sync your scores and compare your rank online. Your learning checklist stays on this device.</p></div></div>
    ${state.result ? `<article class="info-card"><span class="target-number">${state.result.kind === 'quiz' ? 'QUIZ' : state.result.kind === 'snake' ? 'SOLAR SNAKE' : 'GRID GAME'}</span><h3 style="margin:9px 0">${state.result.kind === 'quiz' ? `${state.result.score} out of 5 correct` : state.result.kind === 'snake' ? `${state.result.score} sun tokens` : `${state.result.score} grid points`}</h3><p>${escapeHtml(state.result.summary)}</p><button class="text-button" data-action="view-results">Open your results →</button></article>` : '<div class="empty-state">Your activity results will appear here after a quiz or energy planning game.</div>'}
    <div class="section-row"><div><span class="eyebrow">Sources</span><h2 style="font-size:25px">Further reading</h2></div></div><div class="source-list"><a href="https://sdgs.un.org/goals/goal7" target="_blank" rel="noreferrer">UN Sustainable Development Goal 7 ↗</a><a href="https://www.un.org/sustainabledevelopment/energy/" target="_blank" rel="noreferrer">UN: Affordable and Clean Energy ↗</a></div>
    <div class="section-row"><div><span class="eyebrow">SCREEN 12 · TAKE ACTION</span><h2 style="font-size:28px">Small actions. Meaningful change.</h2></div></div><div class="checklist">${actionLabels.map((label, index) => `<label class="action-option"><input type="checkbox" data-action-check="${index}" ${state.actions.includes(index) ? 'checked' : ''}/><span>${label}</span></label>`).join('')}</div>
    <div class="cta-banner"><div><h3>Connecting local clean energy. Nourishing communities.</h3><p>Keep discovering how local clean energy networks can make access more reliable.</p></div><button class="btn btn-gold btn-small" data-nav="home">Back home →</button></div>
  </section>`;
}

function accountView() {
  const ranks=state.leaderboard.length?`<ol class="rank-list">${state.leaderboard.map((r,i)=>`<li><b>${i+1}</b><span>${escapeHtml(r.display_name)}<small>${r.games_played} activities · best snake ${r.best_snake}</small></span><strong>${r.points} pts</strong></li>`).join('')}</ol>`:`<div class="empty-state">${escapeHtml(state.leaderboardError||'Online scores appear here after setup and player sign-in.')}</div>`;
  if(state.profile)return `<section class="page">${sectionHead('12','PLAYER PROFILE','Welcome, '+escapeHtml(state.profile.display_name),'Your scores sync online so you can compare your rank across devices.')}<article class="info-card"><span class="target-number">SIGNED IN</span><h2>${escapeHtml(state.profile.display_name)}</h2><p>${escapeHtml(state.profile.email||'')}</p><button class="btn btn-outline btn-small" data-action="sign-out">Sign out</button></article><div class="section-row"><h2>Community rankings</h2><button class="text-button" data-action="leaderboard-refresh">Refresh ↻</button></div>${ranks}<p class="demo-note">Points come from completed activities. Classroom scores are for learning and are not tamper-proof.</p></section>`;
  return `<section class="page">${sectionHead('12','PLAYER PROFILE','Sign in to compete','Create an online profile to save your scores and compare with other SDG 7 Explorer players.')}${!supabaseClient?'<div class="notice"><b>Online setup needed.</b> Add your Supabase project URL and publishable key in this HTML, then run supabase-setup.sql in your project.</div>':''}<form class="info-card auth-form" id="auth-form"><div class="toggle-group"><button type="button" data-action="auth-mode" data-mode="signup" aria-pressed="${state.authMode==='signup'}">Create account</button><button type="button" data-action="auth-mode" data-mode="signin" aria-pressed="${state.authMode==='signin'}">Sign in</button></div>${state.authMode==='signup'?'<label class="auth-field">Display name<input name="display_name" required maxlength="24" autocomplete="nickname"></label>':''}<label class="auth-field">Email<input name="email" type="email" required autocomplete="email"></label><label class="auth-field">Password<input name="password" type="password" required minlength="8" autocomplete="current-password"></label><button class="btn" type="submit" ${supabaseClient?'':'disabled'}>${state.authMode==='signup'?'Create account':'Sign in'} →</button><p id="auth-message" role="status">${escapeHtml(state.authMessage)}</p><p class="demo-note">Supabase handles passwords. Choose a nickname; it will appear on the public leaderboard.</p></form><div class="section-row"><h2>Top players</h2></div>${ranks}</section>`;
}
async function refreshOnlineProfile(){if(!supabaseClient)return;const {data}=await supabaseClient.auth.getUser();const u=data?.user;if(u){const name=(u.user_metadata?.display_name||(u.email||'Player').split('@')[0]).slice(0,24);const {error:profileError}=await supabaseClient.from('profiles').upsert({id:u.id,display_name:name},{onConflict:'id'});if(profileError){state.profile=null;state.authMessage=profileError.code==='23505'?'That display name is already taken. Sign in with the original account or choose another name.':'Could not save your profile: '+profileError.message;return}state.profile={id:u.id,display_name:name,email:u.email}}else state.profile=null;const {data:r,error}=await supabaseClient.from('leaderboard').select('display_name,points,games_played,best_snake').order('points',{ascending:false}).limit(20);state.leaderboard=error?[]:(r||[]);state.leaderboardError=error?error.message:'';if(error)console.warn('Leaderboard:',error.message)}
async function submitOnlineScore(result){if(!supabaseClient||!state.profile)return;const points=result.kind==='quiz'?result.score*20:result.kind==='snake'?Math.min(100,result.score*5):result.score;const {error}=await supabaseClient.from('game_scores').insert({user_id:state.profile.id,game:result.kind,score:points});if(error)showToast('Score sync failed. Check your connection.');else await refreshOnlineProfile()}
function updateNav() {
  const active = state.route === 'profile' ? 'explore' : state.route === 'quiz' || state.route === 'game' || state.route === 'snake' ? 'play' : state.route === 'results' || state.route === 'account' ? 'impact' : state.route;
  document.querySelectorAll('.bottom-nav [data-nav]').forEach((button) => {
    if (button.dataset.nav === active) button.setAttribute('aria-current', 'page');
    else button.removeAttribute('aria-current');
  });
}
function render(options = {}) {
  let markup = '';
  if (state.route === 'home') markup = homeView();
  else if (state.route === 'learn') markup = learnView();
  else if (state.route === 'explore') markup = exploreView();
  else if (state.route === 'profile') markup = profileView();
  else if (state.route === 'play') markup = playView();
  else if (state.route === 'quiz') markup = quizView();
  else if (state.route === 'game') markup = gameView();
  else if (state.route === 'snake') markup = snakeView();
  else if (state.route === 'results') markup = resultsView();
  else if (state.route === 'impact') markup = impactView();
  else if (state.route === 'account') markup = accountView();
  const active = document.activeElement;
  const restore = options.restoreSearch && active?.id === 'org-search';
  const caret = restore ? active.selectionStart : null;
  main.innerHTML = markup;
  updateNav();
  const accountButton=document.querySelector('#account-top'); if(accountButton)accountButton.textContent=state.profile?state.profile.display_name:'Sign in';
  if (state.route === 'snake') initSnake();
  if (restore) {
    const search = document.querySelector('#org-search');
    search?.focus();
    search?.setSelectionRange(caret, caret);
  }
  if (options.scroll !== false) window.scrollTo({ top: 0, behavior: 'smooth' });
}
let toastTimer;
function showToast(message) {
  toast.textContent = message;
  toast.classList.add('visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('visible'), 2100);
}
function go(route) { state.route = route; render(); if(route==='account'&&supabaseClient)refreshOnlineProfile().then(()=>{if(state.route==='account')render({scroll:false})}); }
function saveResult(result) {
  state.result = result;
  try { localStorage.setItem('sdg7-result', JSON.stringify(result)); } catch { /* Local persistence is optional in restricted browser modes. */ }
  submitOnlineScore(result);
}
function handleClick(event) {
  const nav = event.target.closest('[data-nav]');
  if (nav) { go(nav.dataset.nav); return; }
  const control = event.target.closest('[data-action]');
  if (!control) return;
  const action = control.dataset.action;
  if (action === 'account') { state.authMessage=''; go('account'); }
  else if (action === 'snake-start' || action === 'snake-retry') { go('snake'); startSnake(); }
  else if (control.hasAttribute('data-snake-dir')) changeSnakeDirection(control.dataset.snakeDir);
  else if (action === 'auth-mode') { state.authMode=control.dataset.mode; state.authMessage=''; render({scroll:false}); }
  else if (action === 'sign-out' && supabaseClient) supabaseClient.auth.signOut().then(()=>{state.profile=null;state.authMessage='You are signed out.';go('account')});
  else if (action === 'leaderboard-refresh') refreshOnlineProfile().then(()=>render({scroll:false}));
  else if (action === 'discover') go('explore');
  else if (action === 'open-org') {
    state.returnRoute = state.route === 'profile' ? state.returnRoute : state.route;
    state.selectedOrg = organizations.find((org) => org.id === control.dataset.id) || organizations[0];
    go('profile');
  } else if (action === 'back') go(state.returnRoute || 'explore');
  else if (action === 'view-mode') { state.exploreMode = control.dataset.mode; render({ scroll: false }); }
  else if (action === 'stage') { state.activeStage = Number(control.dataset.index); render({ scroll: false }); }
  else if (action === 'quiz-start' || action === 'quiz-retry') {
    state.quizIndex = 0; state.quizScore = 0; state.quizChoice = null; state.quizAnswered = false; go('quiz');
  } else if (action === 'answer' && !state.quizAnswered) {
    state.quizChoice = Number(control.dataset.index); state.quizAnswered = true;
    if (state.quizChoice === questions[state.quizIndex].answer) state.quizScore += 1;
    render({ scroll: false });
  } else if (action === 'quiz-next' && state.quizAnswered) {
    if (state.quizIndex < questions.length - 1) {
      state.quizIndex += 1; state.quizChoice = null; state.quizAnswered = false; render();
    } else {
      const score = state.quizScore;
      const summary = score === 5 ? 'Excellent work — you connected the goal’s ideas clearly.' : score >= 3 ? 'Good progress. Keep exploring how access, producers, and distribution fit together.' : 'A useful first step. Revisit the goal and try again when you are ready.';
      saveResult({ kind: 'quiz', score, summary, at: Date.now() }); go('results');
    }
  } else if (action === 'game-start') { state.allocations = [20, 20, 20]; go('game'); }
  else if (action === 'game-retry') { state.allocations = [20, 20, 20]; go('game'); }
  else if (action === 'game-reset') { state.allocations = [20, 20, 20]; render({ scroll: false }); }
  else if (action === 'game-finish') finishGame();
  else if (action === 'view-results') go('results');
}
function routeMetrics() {
  const total = state.allocations.reduce((sum, value) => sum + value, 0);
  const active = centers.filter((_, index) => state.allocations[index] > 0);
  const routeKm = active.reduce((sum, center) => sum + center.km, 0) + (active.length ? Math.max(...active.map((center) => center.km)) : 0);
  const minutes = active.length ? Math.ceil(5 + active.length * 4 + total * .5 + routeKm * 1.2) : 0;
  return { total, minutes, routeKm, stops: active.length, overCapacity: total > 80, overTime: minutes > 90 };
}
function finishGame() {
  const metrics = routeMetrics();
  const total = metrics.total;
  if (metrics.overCapacity) { showToast('The sample grid capacity is 80 energy units. Adjust your route.'); return; }
  if (metrics.overTime) { showToast('The planning window is 90 minutes. Reduce the supply or destinations.'); return; }
  const rates = state.allocations.map((value, index) => value / centers[index].need);
  const spread = Math.max(...rates) - Math.min(...rates);
  const fairness = Math.max(0, Math.round((1 - spread) * 100));
  const coverage = Math.round(total / 80 * 100);
  const reliability = total ? Math.max(0, Math.round((1 - metrics.minutes / 90) * 100)) : 0;
  const score = total ? Math.round(.45 * coverage + .35 * fairness + .20 * reliability) : 0;
  const summary = total === 0 ? 'No energy units were assigned. A useful route begins with community needs and practical capacity.' : score >= 80 ? 'You balanced several community needs while respecting grid capacity and distance.' : 'Your plan shows how capacity, distance, and community needs can pull in different directions.';
  saveResult({ kind: 'game', score, delivered: total, held: 100 - total, coverage, fairness, reliability, routeMinutes: metrics.minutes, summary, allocations: [...state.allocations], at: Date.now() });
  go('results');
}
let snakeEngine=null;
function initSnake(){const canvas=document.querySelector('#snake-canvas');if(!canvas)return;snakeEngine={canvas,ctx:canvas.getContext('2d'),size:18,body:[{x:8,y:10},{x:7,y:10},{x:6,y:10}],dir:'right',next:'right',food:{x:14,y:8},score:0,timer:null,running:false};drawSnake();document.querySelectorAll('[data-snake-dir]').forEach(b=>b.onclick=()=>changeSnakeDirection(b.dataset.snakeDir));if(!window.__snakeKeys){window.__snakeKeys=true;document.addEventListener('keydown',e=>{if(state.route!=='snake')return;const map={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};const d=map[e.key];if(d){e.preventDefault();changeSnakeDirection(d)}})}}
function drawSnake(){if(!snakeEngine)return;const {ctx,canvas,size,body,food}=snakeEngine;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#e8eee4';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#d9e1d5';for(let n=size;n<canvas.width;n+=size){ctx.beginPath();ctx.moveTo(n,0);ctx.lineTo(n,canvas.height);ctx.stroke();ctx.beginPath();ctx.moveTo(0,n);ctx.lineTo(canvas.width,n);ctx.stroke()}ctx.fillStyle='#e5bb4c';ctx.beginPath();ctx.arc(food.x*size+size/2,food.y*size+size/2,size*.4,0,Math.PI*2);ctx.fill();body.forEach((p,i)=>{ctx.fillStyle=i?'#557c63':'#285746';ctx.fillRect(p.x*size+2,p.y*size+2,size-4,size-4)});const score=document.querySelector('#snake-score');if(score)score.textContent=snakeEngine.score}
function changeSnakeDirection(d){if(!snakeEngine||!snakeEngine.running)return;const opposite={up:'down',down:'up',left:'right',right:'left'};if(d!==opposite[snakeEngine.dir])snakeEngine.next=d}
function startSnake(){if(!snakeEngine)return;clearInterval(snakeEngine.timer);snakeEngine.body=[{x:8,y:10},{x:7,y:10},{x:6,y:10}];snakeEngine.dir='right';snakeEngine.next='right';snakeEngine.score=0;snakeEngine.food={x:14,y:8};snakeEngine.running=true;const m=document.querySelector('#snake-message');if(m)m.textContent='Collect the sun tokens. Keep clear of the walls and your tail.';snakeEngine.timer=setInterval(()=>{const g=snakeEngine;g.dir=g.next;const v={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[g.dir];const head={x:g.body[0].x+v[0],y:g.body[0].y+v[1]};const eating=head.x===g.food.x&&head.y===g.food.y;const bodyCheck=eating?g.body:g.body.slice(0,-1);if(head.x<0||head.y<0||head.x>=20||head.y>=20||bodyCheck.some(p=>p.x===head.x&&p.y===head.y)){clearInterval(g.timer);g.running=false;state.snakeBest=Math.max(state.snakeBest,g.score);try{localStorage.setItem('sdg7-snake-best',String(state.snakeBest))}catch{};saveResult({kind:'snake',score:g.score,summary:'You collected '+g.score+' clean-energy tokens in Solar Snake.',at:Date.now()});go('results');return}g.body.unshift(head);if(eating){g.score++;g.food={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)};while(g.body.some(p=>p.x===g.food.x&&p.y===g.food.y))g.food={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)}}else g.body.pop();drawSnake()},125)}
async function handleSubmit(event) {
  if(event.target.id!=='auth-form')return;
  event.preventDefault(); if(!supabaseClient){state.authMessage='Add your Supabase URL and publishable key first.';render({scroll:false});return;}
  const form=new FormData(event.target),email=String(form.get('email')||''),password=String(form.get('password')||'');
  const button=event.target.querySelector('[type="submit"]'); if(button)button.disabled=true;
  if(state.authMode==='signup'){
    const name=String(form.get('display_name')||'').trim().slice(0,24);
    const {data,error}=await supabaseClient.auth.signUp({email,password,options:{data:{display_name:name}}});
    state.authMessage=error?error.message:(data.session?'Account created. You are signed in.':'Check your email to confirm your account, then sign in.');
  }else{const {error}=await supabaseClient.auth.signInWithPassword({email,password});state.authMessage=error?error.message:'Signed in. Loading your profile…';}
  await refreshOnlineProfile(); if(state.profile)go('account'); else render({scroll:false});
}
function handleInput(event) {
  if (event.target.id === 'org-search') { state.search = event.target.value; render({ scroll: false, restoreSearch: true }); }
  else if (event.target.id === 'org-filter') { state.category = event.target.value; render({ scroll: false }); }
  else if (event.target.hasAttribute('data-game-index')) {
    const index = Number(event.target.dataset.gameIndex);
    state.allocations[index] = Number(event.target.value);
    const metrics = routeMetrics();
    const total = metrics.total;
    const output = document.querySelector(`#allocation-${index}`);
    if (output) output.textContent = `${state.allocations[index]} / ${centers[index].need}`;
    const value = document.querySelector('#load-value');
    const fill = document.querySelector('#load-fill');
    const message = document.querySelector('#load-message');
    const finish = document.querySelector('[data-action="game-finish"]');
    const bar = document.querySelector('[role="progressbar"]');
    if (value) value.textContent = `${total} / 80 energy units`;
    if (fill) { fill.style.width = `${Math.min(total / 80 * 100, 100)}%`; fill.classList.toggle('over', metrics.overCapacity); }
    if (message) message.textContent = metrics.overCapacity ? 'Over capacity' : `${80 - total} energy units available`;
    const timeValue = document.querySelector('#time-value');
    const timeFill = document.querySelector('#time-fill');
    const timeMessage = document.querySelector('#time-message');
    const timeBar = document.querySelectorAll('[role="progressbar"]')[1];
    if (timeValue) timeValue.textContent = `${metrics.minutes} / 90 min`;
    if (timeFill) { timeFill.style.width = `${Math.min(metrics.minutes / 90 * 100, 100)}%`; timeFill.classList.toggle('over', metrics.overTime); }
    if (timeMessage) timeMessage.textContent = metrics.overTime ? 'Time limit exceeded' : `${90 - metrics.minutes} min left`;
    if (timeBar) timeBar.setAttribute('aria-valuenow', String(Math.min(metrics.minutes, 90)));
    if (finish) { finish.disabled = metrics.overCapacity || metrics.overTime; finish.style.opacity = finish.disabled ? '.5' : '1'; finish.style.cursor = finish.disabled ? 'not-allowed' : 'pointer'; }
    if (bar) bar.setAttribute('aria-valuenow', String(Math.min(total, 80)));
  }
}
function handleChange(event) {
  if (event.target.hasAttribute('data-action-check')) {
    const index = Number(event.target.dataset.actionCheck);
    if (event.target.checked && !state.actions.includes(index)) state.actions.push(index);
    if (!event.target.checked) state.actions = state.actions.filter((item) => item !== index);
    try { localStorage.setItem('sdg7-actions', JSON.stringify(state.actions)); } catch { /* Device-only preference is optional. */ }
    showToast(event.target.checked ? 'Action saved on this device.' : 'Action removed.');
  }
}
document.addEventListener('click', handleClick);
document.addEventListener('input', handleInput);
document.addEventListener('change', handleChange);
document.addEventListener('submit', handleSubmit);
document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && state.route === 'profile') go(state.returnRoute || 'explore'); });

render();
if(supabaseClient)refreshOnlineProfile().then(()=>{const b=document.querySelector('#account-top');if(b&&state.profile)b.textContent=state.profile.display_name});

</script>
